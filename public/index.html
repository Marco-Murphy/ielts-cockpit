<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>IELTS Cockpit · 雅思冲刺舱</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/main.css">

<body>
  <header class="topbar">

      <span class="logo">🎯 IELTS Cockpit</span>

    <div class="topbar-right">

  <div class="layout">
    <nav class="sidebar" id="sidebar">

    <main class="content" id="content">
      <div class="loading">加载中...</div>
    </main>
  </div>

  <nav class="tabbar" id="tabbar">
    <a href="#/dashboard" class="tab-item">📊</a>
    <a href="#/mock-test" class="tab-item">⏱</a>
    <a href="#/vocab" class="tab-item">📚</a>
    <a href="#/insights" class="tab-item">💡</a>
    <a href="#/checkin" class="tab-item">🔥</a>

  </nav>
